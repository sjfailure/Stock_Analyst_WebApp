databases:
  - name: stock_analyst_db
    plan: free
    databaseName: stock_data_db.db
    user: adminsj

services:
  - type: web
    plan: free
    name: sjstockwebapp
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn mvp_stock_app.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stock_analyst_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4